<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Freedom's Arcade v4 — Link Generator</title>
  <link rel="stylesheet" href="css/loading.css" />
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
</head>
<body>
  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="loading-content">
      <div class="spinner">
        <div class="spinner-circle"></div>
        <div class="spinner-circle"></div>
        <div class="spinner-circle"></div>
        <div class="spinner-circle"></div>
      </div>
      <p id="loading-text" class="loading-text">initializing</p>
      <div id="loading-progress" class="loading-progress"></div>
    </div>
  </div>

  <!-- Main Content -->
  <main id="main-content" class="main-content hidden">
    <!-- Link Gen Portal -->
    <section id="link-gen-portal" class="portal">
      <div class="portal-card glass">
        <h1 class="title">
          <span class="white">freedoms arcade </span><span class="blue">v4</span>
        </h1>
        <p class="subtitle">Select your filter to get an unblocked link</p>

        <div id="step-filter" class="step active">
          <button id="btn-get-link" class="btn btn-primary">get my link</button>
        </div>

        <div id="step-select-filter" class="step">
          <h2 class="step-title">Which filter does your school use?</h2>
          <div id="filter-list" class="filter-list"></div>
          <button id="btn-back-filter" class="btn btn-ghost">back</button>
        </div>

        <div id="step-result" class="step">
          <h2 class="step-title">Your Link</h2>
          <div id="link-box" class="link-box in-box-loading">
            <div id="link-box-content" class="link-box-content">
              <p id="link-url-text" class="link-url"></p>
              <button id="btn-open-link" class="btn btn-primary">open link</button>
            </div>
            <div id="link-box-loading" class="in-box-loading-anim hidden">
              <div class="dots-container">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
              </div>
              <p id="in-box-text" class="in-box-text"></p>
            </div>
          </div>
          <div class="link-actions">
            <button id="btn-works" class="btn btn-success">link works</button>
            <button id="btn-doesnt-work" class="btn btn-danger">doesn't work</button>
          </div>
          <button id="btn-new-link" class="btn btn-ghost">get another link</button>
        </div>
      </div>

      <!-- Admin trigger (bottom right corner) -->
      <div id="admin-trigger" class="admin-trigger"></div>
    </section>

    <!-- Admin Login Frame -->
    <div id="admin-login-frame" class="modal hidden">
      <div class="modal-content glass">
        <h2 class="error-404">404</h2>
        <p class="error-sub">page not found</p>
        <input type="text" id="admin-code-input" class="admin-code-input" placeholder="enter code" maxlength="3" />
        <button id="btn-admin-code" class="btn btn-primary">submit</button>
        <button id="btn-admin-close" class="btn btn-ghost">close</button>
      </div>
    </div>

    <!-- Admin Login Form -->
    <div id="admin-auth-frame" class="modal hidden">
      <div class="modal-content glass">
        <h2 class="title"><span class="white">admin </span><span class="blue">access</span></h2>
        <input type="email" id="admin-email" class="input" placeholder="email" />
        <input type="password" id="admin-password" class="input" placeholder="password" />
        <button id="btn-admin-login" class="btn btn-primary">sign in</button>
        <button id="btn-admin-auth-close" class="btn btn-ghost">cancel</button>
      </div>
    </div>

    <!-- Admin Suite -->
    <section id="admin-suite" class="admin-suite hidden">
      <div class="admin-header">
        <h2 class="title"><span class="white">admin </span><span class="blue">suite</span></h2>
        <button id="btn-admin-logout" class="btn btn-ghost">logout</button>
      </div>

      <div class="admin-tabs">
        <button class="admin-tab active" data-tab="links">Links</button>
        <button class="admin-tab" data-tab="filters">Filters</button>
        <button class="admin-tab" data-tab="users">Users</button>
        <button class="admin-tab" data-tab="settings">Settings</button>
      </div>

      <!-- Links Tab -->
      <div id="tab-links" class="admin-tab-content active">
        <div class="admin-form">
          <h3>Add Proxy Link</h3>
          <input type="text" id="new-link-url" class="input" placeholder="https://..." />
          <select id="new-link-filter" class="input"></select>
          <input type="number" id="new-link-strength" class="input" placeholder="Filter strength (1-10)" value="1" min="1" max="10" />
          <button id="btn-add-link" class="btn btn-primary">add link</button>
        </div>
        <div id="admin-links-list" class="admin-list"></div>
      </div>

      <!-- Filters Tab -->
      <div id="tab-filters" class="admin-tab-content">
        <div class="admin-form">
          <h3>Add Filter</h3>
          <input type="text" id="new-filter-name" class="input" placeholder="Filter name" />
          <input type="text" id="new-filter-desc" class="input" placeholder="Description" />
          <input type="number" id="new-filter-strength" class="input" placeholder="Strength (1-10)" value="1" min="1" max="10" />
          <button id="btn-add-filter" class="btn btn-primary">add filter</button>
        </div>
        <div id="admin-filters-list" class="admin-list"></div>
      </div>

      <!-- Users Tab -->
      <div id="tab-users" class="admin-tab-content">
        <div id="admin-users-list" class="admin-list"></div>
      </div>

      <!-- Settings Tab -->
      <div id="tab-settings" class="admin-tab-content">
        <div class="admin-form">
          <h3>System Settings</h3>
          <label class="toggle-label">
            <span>Link Generator Enabled</span>
            <input type="checkbox" id="toggle-link-gen" class="toggle" />
          </label>
          <button id="btn-save-settings" class="btn btn-primary">save settings</button>
        </div>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>

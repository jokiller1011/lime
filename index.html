<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freedoms Arcade | Link Gen</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Standard Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay">
    <div class="spinner">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>
    <p id="loading-text" class="loading-text">initializing</p>
  </div>

  <!-- Main Content -->
  <div id="main-content" class="hidden">
    <div class="portal-container">
      <h1 class="logo-text">
        <span class="white">freedoms arcade</span> <span class="blue">v4</span>
      </h1>
      <button id="get-link-btn" class="primary-btn">get my link</button>

      <!-- Filter Selection -->
      <div id="filter-selection" class="hidden">
        <p class="prompt">which filter do you have?</p>
        <div id="filter-grid" class="filter-grid"></div>
      </div>

      <!-- In-Box Link Generation (Space Theme) -->
      <div id="inbox-container" class="inbox-container hidden">
        <div class="inbox-space-bg">
          <!-- Dots zooming by -->
          <div class="space-dot" style="top:10%; left:20%; animation-delay:0s;"></div>
          <div class="space-dot" style="top:40%; left:80%; animation-delay:0.5s;"></div>
          <div class="space-dot" style="top:70%; left:10%; animation-delay:1s;"></div>
          <div class="space-dot" style="top:90%; left:50%; animation-delay:1.5s;"></div>
          <div class="space-dot" style="top:30%; left:40%; animation-delay:2s;"></div>
        </div>
        <div class="inbox-content">
          <p id="inbox-text" class="inbox-text">connecting to link gen</p>
          <div id="link-result" class="link-result hidden">
            <a id="generated-link" href="#" target="_blank" class="generated-link">open link</a>
            <div class="feedback-buttons">
              <button id="works-btn" class="feedback-btn works">it works</button>
              <button id="broken-btn" class="feedback-btn broken">it doesn't work</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Admin Trigger -->
      <div id="admin-trigger" class="admin-trigger"></div>
    </div>
  </div>

  <!-- Admin Modal (404 Decoy) -->
  <div id="admin-modal" class="modal hidden">
    <div class="modal-content">
      <p class="error-code">404</p>
      <p class="error-msg">that's an error</p>
      <input type="text" id="admin-code-input" placeholder="enter code..." class="admin-input">
      <button id="admin-submit" class="primary-btn">submit</button>
    </div>
  </div>

  <!-- Admin Auth Portal -->
  <div id="admin-auth" class="modal hidden">
    <div class="modal-content">
      <h2>admin portal</h2>
      <input type="email" id="admin-email" placeholder="email" class="admin-input">
      <input type="password" id="admin-password" placeholder="password" class="admin-input">
      <button id="admin-login-btn" class="primary-btn">login</button>
      <div class="divider">or</div>
      <button id="admin-github-btn" class="github-btn">
        <img src="https://cdn.simpleicons.org/github/white" width="20"> continue with github
      </button>
    </div>
  </div>

  <div id="admin-suite" class="admin-suite hidden">
    <h1>Admin Suite</h1>
    <div class="admin-tabs">
      <button class="tab-btn active" data-tab="links">Links</button>
      <button class="tab-btn" data-tab="accounts">Accounts</button>
      <button class="tab-btn" data-tab="settings">Settings</button>
    </div>
    <div id="tab-links" class="tab-content active">
      <div class="link-form">
        <select id="new-link-filter"></select>
        <input type="text" id="new-link-url" placeholder="https://link.freedomsarcade.com/...">
        <button id="add-link-btn" class="primary-btn">Add Link</button>
      </div>
      <table id="links-table">
        <thead><tr><th>Filter</th><th>URL</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="tab-accounts" class="tab-content">
      <table id="accounts-table">
        <thead><tr><th>Email</th><th>Provider</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>
    </div>
    <div id="tab-settings" class="tab-content">
      <label class="toggle">
        <input type="checkbox" id="link-gen-enabled" checked>
        <span>Link Generator Enabled</span>
      </label>
      <button id="save-settings-btn" class="primary-btn">Save Settings</button>
    </div>
  </div>

  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>

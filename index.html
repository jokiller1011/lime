<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Freedom's Arcade v4 — Link Gen</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app">
    <!-- Main Portal -->
    <div id="main-portal" class="portal-container">
      <div class="portal-box" id="portal-box">
        <h1 class="portal-title">
          <span class="white">freedoms arcade</span>
          <span class="light-blue">v4</span>
        </h1>
        <p class="portal-subtitle">link generator</p>

        <!-- Filter Selection -->
        <div id="filter-section" class="hidden">
          <p class="section-label">Select your school filter:</p>
          <div id="filter-grid" class="filter-grid"></div>
        </div>

        <!-- Get Link Button -->
        <button id="get-link-btn" class="portal-btn">get my link</button>

        <!-- Link Result Frame -->
        <div id="link-result-frame" class="link-result-frame hidden">
          <!-- In-box loading goes here -->
        </div>

        <!-- Error / No Links -->
        <div id="no-links-msg" class="hidden">
          <p>No working links found for your filter.</p>
          <p>Try again later or use a different filter.</p>
        </div>
      </div>

      <!-- Admin corner trigger -->
      <div id="admin-corner" class="admin-corner"></div>
    </div>

    <!-- 404 Admin Gate -->
    <div id="admin-gate" class="admin-gate hidden">
      <div class="admin-gate-box">
        <h2 class="error-404">404</h2>
        <p class="error-sub">That's an error.</p>
        <input type="text" id="admin-code-input" placeholder="Enter code..." autocomplete="off">
        <button id="admin-code-submit" class="portal-btn small">verify</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
